# Build the market index and deploy it to GitHub Pages.
#
# The build reads the npm registry and the published tarballs, never a plugin checkout: plugin
# repositories do not exist on this runner. Everything that can drift is therefore re-read on every
# run, which is why the schedule exists at all — a plugin can publish a version and this index has
# to notice without anyone pushing here.
#
# Triggers, and why each one exists:
#   - `push` on main, on the files that define the index, so a curation change goes live immediately;
#   - `pull_request`, so a curation change is validated *before* it can reach main (build only, no deploy);
#   - `workflow_dispatch`, for a rebuild after a plugin release;
#   - `schedule`, hourly, because a publish changes nothing in this repository.
#
# Build and deploy are separate jobs on purpose: the deploy job is the only one that holds a Pages
# environment and a write scope, so a pull request can run the whole build and validation with a
# read-only token and never touch the live site.
#
# Deployment is also skipped when `index.json` is byte-identical to what is already live. That keeps
# the deployment history meaningful ("the content changed here") instead of 24 identical deploys a
# day, and it is why `status.json` carries a `builtAt` — to answer "how old is this index?" the
# deployment history no longer does.
#
# The deploy publishes `public/` as an artifact rather than committing the index back here: the index
# is a function of the organization + config.json + what npm publishes, and a committed copy would be a
# second source of truth that can be stale.
name: Build market index

on:
  push:
    branches: [main]
    paths:
      - 'config.json'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-market.yml'
  pull_request:
    paths:
      - 'config.json'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-market.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

# One deployment at a time, and never cancel one that is already running: a half-deployed Pages
# site is worse than a late one. Hourly and push runs queue behind each other rather than racing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    permissions:
      contents: read
      # The failure report below opens or comments on an issue. Nothing else in this job writes.
      issues: write
    steps:
      - uses: actions/checkout@v7

      # pnpm has to be installed before setup-node, or `cache: pnpm` cannot find the store.
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          # .node-version is the single source for the baseline, so CI cannot drift from a laptop.
          node-version-file: .node-version
          cache: pnpm

      # Frozen install: this job must fail when the lockfile and package.json disagree, rather than
      # quietly resolve a different validator than the one that was tested.
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      # No network, no clock: the tar reader, the URL normalisation and the diagnostic codes. The tar
      # reader is the one piece whose failure is silent by design, so it is the one piece that must be
      # pinned before a build is trusted.
      - name: Test the scripts
        run: pnpm run test

      - name: Build the index
        run: pnpm run build
        env:
          # Not optional any more. The roster is discovered from the organization, so an exhausted
          # anonymous quota (60 requests/hour) fails the build outright rather than degrading: without
          # the repository list there is no index to build. The token raises the ceiling to 5,000.
          GITHUB_TOKEN: ${{ github.token }}

      # The same validator DSH runs when it reads an index. A red step here means the index would
      # have been rejected on the user's machine, so it must never be deployed. It also ratchets the
      # build's degradation codes against diagnostics-baseline.json.
      - name: Validate the index
        run: pnpm run check

      # Build quality is not part of the index, but it still has to be visible somewhere. The summary
      # shows it on the run page; the artifact keeps the detail after the log expires.
      - name: Summarise the build diagnostics
        if: always()
        run: |
          if [ -f build/diagnostics.json ]; then
            count=$(jq -r '.count' build/diagnostics.json)
            codes=$(jq -r 'if (.codes | length) == 0 then "none" else (.codes | join(", ")) end' build/diagnostics.json)
            {
              echo '### Market build diagnostics'
              echo ''
              echo "\`${count}\` occurrence(s): \`${codes}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics
          path: build/diagnostics.json
          if-no-files-found: ignore

      # The market is a photograph of npm, so it cannot see the gap between a merge and a release. This
      # asks the other side: does the organization declare something npm does not serve yet, or does a
      # plugin repository exist that the market does not list? Report only — releasing and listing are
      # human decisions, and an automatic fix would make the market claim what nobody decided.
      - name: Compare the market with the organization
        continue-on-error: true
        run: node scripts/check-org-drift.mjs --write build/org-drift.json
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Report drift in the tracking issue
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[market] the market and the organization disagree'
        run: |
          if [ ! -f build/org-drift.json ]; then
            exit 0
          fi
          count=$(jq -r '.findings | length' build/org-drift.json)
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --template '{{range .}}{{.number}}{{"\t"}}{{.title}}{{"\n"}}{{end}}' \
            | awk -F'\t' -v t="$TITLE" '$2==t{print $1; exit}')
          if [ "$count" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "The market and the organization agree again."
              gh issue close "$number" --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi
          {
            echo "The market index and the organization's repositories disagree. This is drift, not a build failure: the index serves what npm has, and npm is behind the repositories."
            echo ""
            jq -r '.findings[] | "- **\(.code)**: \(.message)"' build/org-drift.json
            echo ""
            echo "Each line is either a merge that has not been released, or a plugin repository that discovery does not list. Fixing it is a release or a curation change; this issue closes itself on the next run that finds no drift."
          } > /tmp/body.md
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/body.md
          fi

      # Compare against what readers are being served right now. A failed fetch means "deploy", not
      # "skip": a stale live copy is worse than a redundant deployment.
      #
      # The comparison covers the whole published set, not just index.json. status.json is deployed too,
      # and its shape can change while the index content does not — that happened when the record
      # gained content.hash and again when it gained per-package sizes, and deduplicating on the index
      # alone left readers on the previous shape until some plugin happened to publish. So the record is
      # compared after dropping `build`, which holds times and durations: those change on every run, and
      # comparing them would deploy hourly, which is exactly what deduplication exists to prevent.
      - name: Compare with the live index
        id: compare
        run: |
          url=$(jq -r '.market.indexUrl' config.json)
          statusurl=$(dirname "$url")/status.json
          built=$(sha256sum public/index.json | cut -d' ' -f1)
          live=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1 || true)
          built_status=$(jq -S 'del(.build)' public/status.json | sha256sum | cut -d' ' -f1)
          live_status=$(curl -fsSL "$statusurl" | jq -S 'del(.build)' 2>/dev/null | sha256sum | cut -d' ' -f1 || echo "?")
          echo "index:  built ${built}, live ${live:-unreachable}"
          echo "status: built ${built_status}, live ${live_status}"
          if [ -n "$live" ] && [ "$live" = "$built" ] && [ "$live_status" = "$built_status" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "the published set is unchanged; the deployment is skipped"
          elif [ -n "$live" ] && [ "$live" = "$built" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "the index is unchanged but the build record is not — deploying so readers see it"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "the index changed; it will be deployed"
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      # Small, and separate from the Pages artifact: the verify job compares what readers get against
      # exactly what this run built, including the build time that tells "updated" from "old copy".
      - name: Keep what this run built
        uses: actions/upload-artifact@v7
        with:
          name: built-index
          path: |
            public/index.json
            public/status.json
          retention-days: 1

      # A scheduled failure notifies only whoever last edited the cron line, so a silent index is the
      # default outcome of a silent failure. This keeps one fixed-title issue as the visible home for
      # that failure instead, and closes it again when a later run succeeds.
      - name: Report a failed build
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[market] the index build is failing'
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --template '{{range .}}{{.number}}{{"\t"}}{{.title}}{{"\n"}}{{end}}' \
            | awk -F'\t' -v t="$TITLE" '$2==t{print $1; exit}')
          body=$(printf 'The build that publishes the market index failed.\n\n- run: %s\n- trigger: `%s`\n- commit: `%s`\n\nThe live index is unchanged — the previous one is still being served. Read the failed step, fix the cause, then re-run the workflow.\n\nThis issue is commented by every later failure and closed by the next success; do not file a new one.' \
            "$RUN" "$GITHUB_EVENT_NAME" "$GITHUB_SHA")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi

      - name: Close the failure issue
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[market] the index build is failing'
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --template '{{range .}}{{.number}}{{"\t"}}{{.title}}{{"\n"}}{{end}}' \
            | awk -F'\t' -v t="$TITLE" '$2==t{print $1; exit}')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "A later run succeeded, so the index is being built again."
            gh issue close "$number" --repo "$GITHUB_REPOSITORY"
          fi

  deploy:
    needs: build
    # A pull request gets the build and the validator, and nothing else. An unchanged index gets no
    # deployment, which is a deliberate skip rather than a false green: the `build` job is the judge.
    if: github.event_name != 'pull_request' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Everything above checks files this runner produced. That is a different claim from "the URL serves
  # them", and a deployment that silently publishes the previous generation looks exactly like success
  # from the inside. This job asks the published URL instead of the artifact.
  verify:
    needs: [build, deploy]
    if: github.event_name != 'pull_request' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - uses: actions/download-artifact@v8
        with:
          name: built-index
          path: built

      - name: Verify the deployed index
        run: node scripts/verify-deployed.mjs --built built
